name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  workbench-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Workbench contract and live workflow
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/workbench/workbench_contract.py \
            scripts/workbench/live_workbench.py \
            scripts/workbench/local_wal_recovery_gate.py \
            scripts/workbench/object_namespace_recovery_gate.py
          python3 scripts/workbench/workbench_contract_test.py
          python3 scripts/workbench/live_workbench_test.py
          python3 scripts/workbench/local_wal_recovery_gate_test.py
          python3 scripts/workbench/object_namespace_recovery_gate_test.py
          bash -n scripts/workbench/start_rustfs.sh

      - name: Check Homebrew release safety
        run: python3 scripts/release/test_homebrew_source_release.py

  nokv-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETCD_VERSION: v3.7.1
      ETCD_LINUX_AMD64_SHA256: e8cd3fa8064c98137c5dbd78b76f969417ace84efb83c481041d7a52ffdd8fb9
      RUSTFS_IMAGE: rustfs/rustfs@sha256:e620d37756fff072b10bf648c7bb9d370d7e91a928b7e6a5e1ac85bdfb4e4dab
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy metadata read diagnostics
        run: |
          cargo clippy -p nokv-meta -p nokv-bench --all-targets --features metadata-read-stats -- -D warnings
          cargo clippy -p nokv-meta-holt --all-targets --features read-stats -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test metadata read diagnostics
        run: |
          cargo test -p nokv-meta --features metadata-read-stats
          cargo test -p nokv-meta-holt --features read-stats
          cargo test -p nokv-bench --features metadata-read-stats

      - name: Install pinned etcd
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/etcd-$ETCD_VERSION-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/etcd-$ETCD_VERSION"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/etcd-io/etcd/releases/download/$ETCD_VERSION/etcd-$ETCD_VERSION-linux-amd64.tar.gz"
          echo "$ETCD_LINUX_AMD64_SHA256  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >>"$GITHUB_PATH"
          "$install_dir/etcd" --version
          "$install_dir/etcdctl" version

      - name: Start pinned RustFS for namespace admission
        shell: bash
        env:
          NOKV_WORKBENCH_RUSTFS_CONTAINER: nokv-local-wal-recovery-rustfs
          NOKV_WORKBENCH_RUSTFS_VOLUME: nokv-local-wal-recovery-rustfs-data
          NOKV_WORKBENCH_RUSTFS_IMAGE: ${{ env.RUSTFS_IMAGE }}
          NOKV_WORKBENCH_S3_BUCKET: nokv-local-wal-recovery-gate
          NOKV_WORKBENCH_S3_ENDPOINT: http://127.0.0.1:9000
          NOKV_WORKBENCH_S3_ACCESS_KEY_ID: rustfsadmin
          NOKV_WORKBENCH_S3_SECRET_ACCESS_KEY: rustfsadmin
        run: |
          set -euo pipefail
          aws --version
          docker --version
          bash scripts/workbench/start_rustfs.sh

      - name: Qualify interrupted local-WAL successor recovery
        id: local_wal_recovery
        shell: bash
        env:
          RECOVERY_EVIDENCE_DIR: ${{ runner.temp }}/local-wal-recovery-evidence
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          python3 scripts/workbench/local_wal_recovery_gate.py \
            --build \
            --target-dir target \
            --evidence-dir "$RECOVERY_EVIDENCE_DIR" \
            --object-endpoint http://127.0.0.1:9000 \
            --object-bucket nokv-local-wal-recovery-gate \
            --timeout 45

      - name: Upload local-WAL recovery evidence
        if: ${{ always() && steps.local_wal_recovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-wal-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/local-wal-recovery-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Remove pinned RustFS
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm -f nokv-local-wal-recovery-rustfs >/dev/null 2>&1 || true
          docker volume rm -f nokv-local-wal-recovery-rustfs-data >/dev/null 2>&1 || true

  object-namespace-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETCD_VERSION: v3.7.1
      ETCD_LINUX_AMD64_SHA256: e8cd3fa8064c98137c5dbd78b76f969417ace84efb83c481041d7a52ffdd8fb9
      RUSTFS_IMAGE: rustfs/rustfs@sha256:e620d37756fff072b10bf648c7bb9d370d7e91a928b7e6a5e1ac85bdfb4e4dab
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pinned etcd
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/etcd-$ETCD_VERSION-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/etcd-$ETCD_VERSION"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/etcd-io/etcd/releases/download/$ETCD_VERSION/etcd-$ETCD_VERSION-linux-amd64.tar.gz"
          echo "$ETCD_LINUX_AMD64_SHA256  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >>"$GITHUB_PATH"
          "$install_dir/etcd" --version
          "$install_dir/etcdctl" version

      - name: Qualify object namespace restart and retry
        id: object_namespace_recovery
        shell: bash
        env:
          OBJECT_RECOVERY_EVIDENCE_DIR: ${{ runner.temp }}/object-namespace-recovery-evidence
        run: |
          set -euo pipefail
          aws --version
          docker --version
          python3 scripts/workbench/object_namespace_recovery_gate.py \
            --build \
            --target-dir target \
            --rustfs-image "$RUSTFS_IMAGE" \
            --evidence-dir "$OBJECT_RECOVERY_EVIDENCE_DIR" \
            --timeout 60

      - name: Upload object namespace recovery evidence
        if: ${{ always() && steps.object_namespace_recovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: object-namespace-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/object-namespace-recovery-evidence
          if-no-files-found: error
          retention-days: 7
