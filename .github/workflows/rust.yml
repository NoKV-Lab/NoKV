name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy default runtime
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check feature-gated FDB composition
        run: |
          cargo check -p nokv-server --features fdb --all-targets
          cargo check -p nokv --features fdb --all-targets
          cargo clippy -p nokv-server --features fdb --all-targets -- -D warnings
          cargo clippy -p nokv --features fdb --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Test metadata read diagnostics
        run: |
          cargo test -p nokv-meta --features metadata-read-stats
          cargo test -p nokv-meta-holt --features read-stats
          cargo test -p nokv-bench --features metadata-read-stats

      - name: Check qualification scripts
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/workbench
          PYTHONPATH=scripts/workbench python3 -m unittest discover \
            -s scripts/workbench -p '*_test.py'
          bash -n scripts/workbench/start_rustfs.sh

      - name: Check release safety
        run: |
          python3 scripts/release/test_homebrew_source_release.py
          python3 scripts/release/test_python_sdk_release.py
          python3 scripts/ci/pr_change_governance_test.py

  standalone-live-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFS_IMAGE: rustfs/rustfs@sha256:e620d37756fff072b10bf648c7bb9d370d7e91a928b7e6a5e1ac85bdfb4e4dab
      RUSTFS_CONTAINER: nokv-holt-live-rustfs
      RUSTFS_VOLUME: nokv-holt-live-rustfs-data
      S3_BUCKET: nokv-holt-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build standalone NoKV
        run: cargo build --locked -p nokv --bin nokv

      - name: Start pinned RustFS
        env:
          NOKV_WORKBENCH_RUSTFS_CONTAINER: ${{ env.RUSTFS_CONTAINER }}
          NOKV_WORKBENCH_RUSTFS_VOLUME: ${{ env.RUSTFS_VOLUME }}
          NOKV_WORKBENCH_RUSTFS_IMAGE: ${{ env.RUSTFS_IMAGE }}
          NOKV_WORKBENCH_S3_BUCKET: ${{ env.S3_BUCKET }}
          NOKV_WORKBENCH_S3_ENDPOINT: http://127.0.0.1:9000
          NOKV_WORKBENCH_S3_ACCESS_KEY_ID: rustfsadmin
          NOKV_WORKBENCH_S3_SECRET_ACCESS_KEY: rustfsadmin
        run: bash scripts/workbench/start_rustfs.sh

      - name: Qualify standalone Holt Workbench
        id: live_workbench
        env:
          LIVE_WORKBENCH_ROOT: ${{ runner.temp }}/live-workbench
        run: |
          set -euo pipefail
          mkdir -p "$LIVE_WORKBENCH_ROOT"
          python3 scripts/workbench/live_workbench.py \
            --nokv-bin target/debug/nokv \
            --evidence-dir "$LIVE_WORKBENCH_ROOT/evidence" \
            --metadata-dir "$LIVE_WORKBENCH_ROOT/metadata" \
            --root-id 11111111111111111111111111111111 \
            --agent-id 44444444444444444444444444444444 \
            --agent-name ci-agent \
            --server-bind 127.0.0.1:17750 \
            --advertise-endpoint 127.0.0.1:17750 \
            --object-endpoint http://127.0.0.1:9000 \
            --object-bucket "$S3_BUCKET" \
            --object-root "live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --object-access-key-id rustfsadmin \
            --object-secret-access-key rustfsadmin \
            --command-timeout-seconds 45
          jq -e '.workbench_workflow.status == "PASS"' \
            "$LIVE_WORKBENCH_ROOT/evidence/qualification.json"

      - name: Upload live Workbench evidence
        if: ${{ always() && steps.live_workbench.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-workbench-${{ github.sha }}
          path: ${{ runner.temp }}/live-workbench
          if-no-files-found: error
          retention-days: 7

      - name: Remove pinned RustFS
        if: ${{ always() }}
        run: |
          docker rm -f "$RUSTFS_CONTAINER" >/dev/null 2>&1 || true
          docker volume rm -f "$RUSTFS_VOLUME" >/dev/null 2>&1 || true
