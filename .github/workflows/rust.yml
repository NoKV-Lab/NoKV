name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  directional-similar-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Check the experimental directional-search contract
        run: make experimental-test

  lingtai-first-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Workbench and LingTai first-client contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/lingtai-workbench/workbench_contract.py \
            scripts/lingtai-workbench/live_first_client.py
          python3 scripts/lingtai-workbench/workbench_contract_test.py
          python3 scripts/lingtai-workbench/live_first_client_test.py
          bash -n scripts/lingtai-workbench/start_rustfs.sh

  nokv-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
