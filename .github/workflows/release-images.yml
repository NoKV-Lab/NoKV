name: Release Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build, for example v0.1.0"
        required: true
      version:
        description: "Release version, for example v0.1.0"
        required: true
      rust_version:
        description: "Rust toolchain image version"
        required: true
        default: "1.91"
      debian_version:
        description: "Debian image version"
        required: true
        default: "bookworm"

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/nokv-lab/nokv
      DOCKERHUB_IMAGE: docker.io/feichai0017/nokv
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The metadata script comes from this workflow's own commit, so an
      # older release ref is labelled the same way.
      - name: Checkout image tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: image-tooling
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Image metadata
        id: metadata
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 image-tooling/scripts/ci/image_metadata.py emit \
            --ref "$RELEASE_REF" --version "$RELEASE_VERSION" \
            --revision "$(git rev-parse HEAD)" --created "$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          plain="${version#v}"
          IFS=. read -r major minor patch <<<"$plain"
          if [[ -z "${major:-}" || -z "${minor:-}" || -z "${patch:-}" ]]; then
            echo "::error title=Invalid release version::Expected vMAJOR.MINOR.PATCH, got $version"
            exit 1
          fi

          {
            echo "ghcr<<EOF"
            printf '%s:%s\n' "$GHCR_IMAGE" "$version"
            printf '%s:%s\n' "$GHCR_IMAGE" "$plain"
            printf '%s:%s.%s\n' "$GHCR_IMAGE" "$major" "$minor"
            printf '%s:%s\n' "$GHCR_IMAGE" "$major"
            printf '%s:latest\n' "$GHCR_IMAGE"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

          {
            echo "dockerhub<<EOF"
            printf '%s:%s\n' "$DOCKERHUB_IMAGE" "$version"
            printf '%s:%s\n' "$DOCKERHUB_IMAGE" "$plain"
            printf '%s:%s.%s\n' "$DOCKERHUB_IMAGE" "$major" "$minor"
            printf '%s:%s\n' "$DOCKERHUB_IMAGE" "$major"
            printf '%s:latest\n' "$DOCKERHUB_IMAGE"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GHCR image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUST_VERSION=${{ inputs.rust_version }}
            DEBIAN_VERSION=${{ inputs.debian_version }}
            NOKV_PACKAGE=nokv
            NOKV_BINARY=nokv
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          # Index annotations need an OCI image index; the exporter's default
          # media types are Docker's.
          outputs: type=image,push=true,oci-mediatypes=true
          tags: ${{ steps.tags.outputs.ghcr }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publish Docker Hub image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUST_VERSION=${{ inputs.rust_version }}
            DEBIAN_VERSION=${{ inputs.debian_version }}
            NOKV_PACKAGE=nokv
            NOKV_BINARY=nokv
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          # Index annotations need an OCI image index; the exporter's default
          # media types are Docker's.
          outputs: type=image,push=true,oci-mediatypes=true
          tags: ${{ steps.tags.outputs.dockerhub }}

      # Artifact Hub's repository metadata: its repository ID marks the
      # listing as published by this registry's owner. Set the repository
      # variable ARTIFACTHUB_REPOSITORY_ID once the listing exists.
      - name: Set up ORAS
        if: vars.ARTIFACTHUB_REPOSITORY_ID != ''
        uses: oras-project/setup-oras@v1

      - name: Publish Artifact Hub repository metadata
        if: vars.ARTIFACTHUB_REPOSITORY_ID != ''
        shell: bash
        env:
          REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$REPOSITORY_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error title=Invalid Artifact Hub repository ID::Expected a UUID, got $REPOSITORY_ID"
            exit 1
          fi
          printf 'repositoryID: %s\n' "$REPOSITORY_ID" > "$RUNNER_TEMP/artifacthub-repo.yml"
          cd "$RUNNER_TEMP"
          oras push "$GHCR_IMAGE:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
