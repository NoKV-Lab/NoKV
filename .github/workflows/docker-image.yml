name: Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.91"
  DEBIAN_VERSION: bookworm

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test image metadata
        run: python3 scripts/ci/image_metadata_test.py

      - name: Image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          created="$(git log -1 --format=%cI)"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          python3 scripts/ci/image_metadata.py emit \
            --ref "$GITHUB_SHA" --version "dev-$GITHUB_SHA" \
            --revision "$GITHUB_SHA" --created "$created" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build both platforms into an OCI layout, so the step below can read
      # the index exactly as a registry would serve it.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
            DEBIAN_VERSION=${{ env.DEBIAN_VERSION }}
            NOKV_PACKAGE=nokv
            NOKV_BINARY=nokv
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          outputs: type=oci,dest=${{ runner.temp }}/nokv-image.tar

      - name: Check image metadata
        shell: bash
        env:
          CREATED: ${{ steps.metadata.outputs.created }}
        run: |
          set -euo pipefail
          python3 scripts/ci/image_metadata.py check "$RUNNER_TEMP/nokv-image.tar" \
            --ref "$GITHUB_SHA" --version "dev-$GITHUB_SHA" \
            --revision "$GITHUB_SHA" --created "$CREATED"
