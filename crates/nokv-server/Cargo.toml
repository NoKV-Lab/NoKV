[package]
name = "nokv-server"
version = "0.1.0"
description = "Logical-shard owner RPC server for NoKV Agent workspaces."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
etcd = ["nokv-control/etcd"]

[dependencies]
nokv-control.workspace = true
nokv-meta.workspace = true
nokv-meta-holt.workspace = true
nokv-meta-store.workspace = true
nokv-object.workspace = true
nokv-protocol.workspace = true
nokv-types.workspace = true
sha2.workspace = true

[dev-dependencies]
nokv-meta-holt = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
