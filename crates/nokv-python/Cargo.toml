[package]
name = "nokv-python"
# Wheel version. Keep equal to the crates/nokv package version; the release
# gate (scripts/release/python_sdk_release.py) refuses a tag otherwise.
version = "0.11.0"
publish = false
description = "Python SDK for NoKV Agent workspaces and immutable artifacts."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
nokv-agent.workspace = true
nokv-client.workspace = true
nokv-workbench-projection.workspace = true
nokv-object.workspace = true
nokv-protocol.workspace = true
nokv-types.workspace = true
pyo3 = { version = "0.29.0", features = ["abi3-py39"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
