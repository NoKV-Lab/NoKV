[package]
name = "nokv-python"
version = "0.1.0"
publish = false
description = "Python SDK for NoKV Agent workspaces and immutable artifacts."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
nokv-client = { workspace = true, features = ["etcd"] }
nokv-object.workspace = true
nokv-protocol.workspace = true
pyo3 = { version = "0.29.0", features = ["abi3-py39"] }

[dev-dependencies]
tempfile.workspace = true
