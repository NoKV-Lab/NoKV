[package]
name = "nokv"
version = "0.11.0"
description = "Custom CLI and MCP wiring for NoKV Agent workspaces."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["etcd"]
etcd = ["nokv-client/etcd", "nokv-control/etcd", "nokv-server/etcd"]
fdb = ["nokv-server/fdb"]

[dependencies]
base64.workspace = true
nokv-client.workspace = true
nokv-control.workspace = true
nokv-object.workspace = true
nokv-protocol.workspace = true
nokv-server.workspace = true
nokv-agent.workspace = true
nokv-workbench-projection.workspace = true
nokv-types.workspace = true
sha2.workspace = true
signal-hook.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
sha2.workspace = true

[[bin]]
name = "nokv"
path = "src/main.rs"

[[bin]]
name = "nokv-fdb"
path = "src/fdb_main.rs"
required-features = ["fdb"]

[dev-dependencies]
tempfile.workspace = true
