[package]
name = "nokv-bench"
version = "0.1.0"
publish = false
description = "NoKV Agent workspace contract and performance workloads."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
metadata-read-stats = ["nokv-meta/metadata-read-stats", "nokv-meta-holt/read-stats"]

[dependencies]
nokv-meta.workspace = true
nokv-meta-holt = { workspace = true, features = ["test-support"] }
nokv-meta-store.workspace = true
nokv-protocol.workspace = true
nokv-server.workspace = true
nokv-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "nokv-workspace-bench"
path = "src/bin/nokv-workspace-bench.rs"

[[bin]]
name = "nokv-bench"
path = "src/bin/nokv-bench.rs"
required-features = ["metadata-read-stats"]
