[package]
name = "nokv-bench"
version = "0.1.0"
publish = false
description = "NoKV Agent workspace contract and performance workloads."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
metadata-read-stats = ["nokv-meta/metadata-read-stats", "nokv-meta-holt/read-stats"]
fdb-serve-qualification = [
    "dep:nokv-control",
    "dep:nokv-control-fdb",
    "dep:nokv-fdb",
    "dep:nokv-meta-fdb",
]
fdb-lifecycle-qualification = [
    "dep:nokv-control",
    "dep:nokv-control-fdb",
    "dep:nokv-fdb",
    "dep:nokv-meta-fdb",
]
fdb-unknown-outcome-qualification = [
    "dep:nokv-control",
    "dep:nokv-control-fdb",
    "dep:nokv-fdb",
    "dep:nokv-meta-fdb",
]

[dependencies]
nokv-client.workspace = true
nokv-control = { workspace = true, optional = true }
nokv-control-fdb = { workspace = true, optional = true, features = ["fdb"] }
nokv-fdb = { workspace = true, optional = true, features = ["fdb"] }
nokv-meta.workspace = true
nokv-meta-fdb = { workspace = true, optional = true, features = ["fdb"] }
nokv-meta-holt = { workspace = true, features = ["test-support"] }
nokv-meta-store.workspace = true
nokv-protocol.workspace = true
nokv-server.workspace = true
nokv-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "nokv-workspace-bench"
path = "src/bin/nokv-workspace-bench.rs"

[[bin]]
name = "nokv-bench"
path = "src/bin/nokv-bench.rs"
required-features = ["metadata-read-stats"]

[[bin]]
name = "nokv-fdb-seed-qualification"
path = "src/bin/nokv-fdb-seed-qualification.rs"

[[bin]]
name = "nokv-fdb-serve-qualification"
path = "src/bin/nokv-fdb-serve-qualification.rs"
required-features = ["fdb-serve-qualification"]

[[bin]]
name = "nokv-fdb-lifecycle-qualification"
path = "src/bin/nokv-fdb-lifecycle-qualification.rs"
required-features = ["fdb-lifecycle-qualification"]

[[bin]]
name = "nokv-fdb-unknown-outcome-qualification"
path = "src/bin/nokv-fdb-unknown-outcome-qualification.rs"
required-features = ["fdb-unknown-outcome-qualification"]
